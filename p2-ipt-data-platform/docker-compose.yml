services:
  # ==========================================
  # SOURCE DATABASES (Operational/OLTP)
  # ==========================================

  # Issues Reporting App
  issues_db:
    image: postgres:15-alpine
    container_name: ipt_issues_db
    environment:
      POSTGRES_DB: issues_app
      POSTGRES_USER: issues_user
      POSTGRES_PASSWORD: issues_pass
    ports:
      - "5432:5432"
    volumes:
      - ./source_databases/issues_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issues_user -d issues_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Room Reservations App
  reservations_db:
    image: postgres:15-alpine
    container_name: ipt_reservations_db
    environment:
      POSTGRES_DB: reservations_app
      POSTGRES_USER: reservations_user
      POSTGRES_PASSWORD: reservations_pass
    ports:
      - "5433:5432"
    volumes:
      - ./source_databases/reservations_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations_user -d reservations_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Summaries and Attendance App
  attendance_db:
    image: postgres:15-alpine
    container_name: ipt_attendance_db
    environment:
      POSTGRES_DB: attendance_app
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    ports:
      - "5435:5432"
    volumes:
      - ./source_databases/attendance_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # SIGQ Platform
  sigq_db:
    image: postgres:15-alpine
    container_name: ipt_sigq_db
    environment:
      POSTGRES_DB: sigq_app
      POSTGRES_USER: sigq_user
      POSTGRES_PASSWORD: sigq_pass
    ports:
      - "5436:5432"
    volumes:
      - ./source_databases/sigq_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigq_user -d sigq_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # ==========================================
  # ANALYTICS ARCHITECTURE (Warehouse & BI)
  # ==========================================

  # 1. The Data Warehouse
  # This acts as the central repository.
  # The volume maps to a local folder named 'warehouse_data' in your project directory.
  warehouse_db:
      image: postgres:15-alpine
      container_name: ipt_warehouse_db
      environment:
        POSTGRES_DB: ipt_warehouse
        POSTGRES_USER: warehouse_user
        POSTGRES_PASSWORD: warehouse_pass
      ports:
        - "5440:5432"
      volumes:
      - ./source_databases/warehouse_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U warehouse_user -d ipt_warehouse"]
        interval: 5s
        timeout: 3s
        retries: 5
      # CRITICAL: Warehouse must wait for sources to be 'Healthy' 
      # otherwise IMPORT SCHEMA will fail because sources aren't ready yet.
      depends_on:
        issues_db:
          condition: service_healthy
        reservations_db:
          condition: service_healthy
        attendance_db:
          condition: service_healthy
        sigq_db:
          condition: service_healthy
      networks:
        - ipt_network

  # 2. Metabase (BI Tool)
  # Connects to the same network to read from the warehouse
  metabase:
    image: metabase/metabase:latest
    container_name: ipt_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      # Persist Metabase settings (dashboards/users) locally
      - ./metabase_data:/metabase-data
    depends_on:
      warehouse_db:
        condition: service_healthy
    networks:
      - ipt_network

  # ==========================================
  # TOOLS
  # ==========================================

  # Adminer - Database browser
  adminer:
    image: adminer:latest
    container_name: ipt_adminer
    ports:
      - "8080:8080"
    environment:
      # Default server set to warehouse for easier access
      ADMINER_DEFAULT_SERVER: warehouse_db
    depends_on:
      - issues_db
      - reservations_db
      - attendance_db
      - sigq_db
      - warehouse_db
    networks:
      - ipt_network

networks:
  ipt_network:
    driver: bridge