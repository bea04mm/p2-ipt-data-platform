services:
  # ==========================================
  # SOURCE DATABASES (Operational/OLTP)
  # ==========================================

  # Issues App service
  issues_db:
    image: postgres:15-alpine
    container_name: ipt_issues_db
    environment:
      POSTGRES_DB: issues_app
      POSTGRES_USER: issues_user
      POSTGRES_PASSWORD: issues_pass
    ports:
      - "5432:5432"
    volumes:
      - ./source_databases/issues_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issues_user -d issues_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Rooms App service
  reservations_db:
    image: postgres:15-alpine
    container_name: ipt_reservations_db
    environment:
      POSTGRES_DB: reservations_app
      POSTGRES_USER: reservations_user
      POSTGRES_PASSWORD: reservations_pass
    ports:
      - "5433:5432"
    volumes:
      - ./source_databases/reservations_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations_user -d reservations_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Attendance App service
  attendance_db:
    image: postgres:15-alpine
    container_name: ipt_attendance_db
    environment:
      POSTGRES_DB: attendance_app
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    ports:
      - "5435:5432"
    volumes:
      - ./source_databases/attendance_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # SIGQ Platform
  sigq_db:
    image: postgres:15-alpine
    container_name: ipt_sigq_db
    environment:
      POSTGRES_DB: sigq_app
      POSTGRES_USER: sigq_user
      POSTGRES_PASSWORD: sigq_pass
    ports:
      - "5436:5432"
    volumes:
      - ./source_databases/sigq_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigq_user -d sigq_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # ==========================================
  # ANALYTICS & TRANSFORMATION
  # ==========================================

  ipt_analytics:
    image: postgres:15-alpine
    container_name: ipt_analytics_db
    environment:
      POSTGRES_DB: ipt_analytics
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
    ports:
      - "5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d ipt_analytics"]
      interval: 5s
      retries: 5
    networks:
      - ipt_network

  # ==========================================
  # ANALYTICS ARCHITECTURE (Warehouse & BI)
  # ==========================================

  # 1. The Data Warehouse
  warehouse_db:
    image: postgres:15-alpine
    container_name: ipt_warehouse_db
    environment:
      POSTGRES_DB: ipt_warehouse
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_pass
    ports:
      - "5440:5432"
    volumes:
      - ./source_databases/warehouse_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_user -d ipt_warehouse"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      issues_db:
        condition: service_healthy
      reservations_db:
        condition: service_healthy
      attendance_db:
        condition: service_healthy
      sigq_db:
        condition: service_healthy
      ipt_analytics:
        condition: service_healthy
    networks:
      - ipt_network

  # 2. Metabase (BI Tool)
  metabase:
    image: metabase/metabase:latest
    container_name: ipt_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ./metabase_data:/metabase-data
    depends_on:
      warehouse_db:
        condition: service_healthy
    networks:
      - ipt_network

  # ==========================================
  # TOOLS
  # ==========================================

  # Adminer - Database GUI
  adminer:
    image: adminer:latest
    container_name: ipt_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: warehouse_db
    depends_on:
      - issues_db
      - reservations_db
      - attendance_db
      - sigq_db
      - warehouse_db
      - ipt_analytics
    networks:
      - ipt_network

  tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: ipt_tools
    volumes:
      - ./scripts:/scripts:ro
    environment:
      # Source databases (using Docker network hostnames)
      ISSUES_DB: "postgresql://issues_user:issues_pass@issues_db:5432/issues_app"
      RESERVATIONS_DB: "postgresql://reservations_user:reservations_pass@reservations_db:5432/reservations_app"
      ATTENDANCE_DB: "postgresql://attendance_user:attendance_pass@attendance_db:5432/attendance_app"
      SIGQ_DB: "postgresql://sigq_user:sigq_pass@sigq_db:5432/sigq_app"
      WAREHOUSE: "postgresql://warehouse_user:warehouse_pass@warehouse_db:5432/ipt_warehouse"
    depends_on:
      issues_db:
        condition: service_healthy
      reservations_db:
        condition: service_healthy
      warehouse_db:
        condition: service_healthy
    networks:
      - ipt_network
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    command: sleep infinity

  # DBT Runner
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.0
    container_name: ipt_dbt
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      DBT_HOST: ipt_analytics
      DBT_DBNAME: ipt_analytics
      DBT_USER: dbt_user
      DBT_PASS: dbt_password
      DBT_PORT: 5432
    volumes:
      - ./dbt_project:/usr/app/dbt_project
    working_dir: /usr/app/dbt_project
    depends_on:
      ipt_analytics:
        condition: service_healthy
    networks:
      - ipt_network

networks:
  ipt_network:
    driver: bridge