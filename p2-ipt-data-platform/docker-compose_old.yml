# IPT Data Platform - Source Databases
#
# This compose file provides 4 PostgreSQL databases simulating operational
# applications at IPT. Each database comes pre-populated with realistic
# sample data covering the 1st semester of 2025/2026.
#
# Students should extend this compose file to add their own warehouse,
# ingestion mechanisms, and dashboard tools as part of the project.

services:
  # Issues Reporting App
  # Staff and students report maintenance issues on campus
  issues_db:
    image: postgres:15-alpine
    container_name: ipt_issues_db
    environment:
      POSTGRES_DB: issues_app
      POSTGRES_USER: issues_user
      POSTGRES_PASSWORD: issues_pass
    ports:
      - "5432:5432"
    volumes:
      - ./source_databases/issues_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issues_user -d issues_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Room Reservations App
  # Room bookings for classes, exams, meetings, and events
  reservations_db:
    image: postgres:15-alpine
    container_name: ipt_reservations_db
    environment:
      POSTGRES_DB: reservations_app
      POSTGRES_USER: reservations_user
      POSTGRES_PASSWORD: reservations_pass
    ports:
      - "5433:5432"
    volumes:
      - ./source_databases/reservations_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations_user -d reservations_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Summaries and Attendance App
  # Class summaries (lesson records) and student attendance tracking
  attendance_db:
    image: postgres:15-alpine
    container_name: ipt_attendance_db
    environment:
      POSTGRES_DB: attendance_app
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_pass
    ports:
      - "5435:5432"
    volumes:
      - ./source_databases/attendance_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance_user -d attendance_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # SIGQ Platform
  # Quality management system with documents, audits, and improvement tracking
  sigq_db:
    image: postgres:15-alpine
    container_name: ipt_sigq_db
    environment:
      POSTGRES_DB: sigq_app
      POSTGRES_USER: sigq_user
      POSTGRES_PASSWORD: sigq_pass
    ports:
      - "5436:5432"
    volumes:
      - ./source_databases/sigq_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigq_user -d sigq_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # Adminer - Database browser
  # Web interface to explore the source databases
  adminer:
    image: adminer:latest
    container_name: ipt_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: issues_db
    depends_on:
      - issues_db
      - reservations_db
      - attendance_db
      - sigq_db
    networks:
      - ipt_network

networks:
  ipt_network:
    driver: bridge
