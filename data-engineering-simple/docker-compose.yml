# =============================================================
# IPT Data Platform - Simple Demo
# =============================================================
# A minimal working example demonstrating ELT with:
# - 2 source databases (Issues App + Room Reservations App)
# - 1 data warehouse (PostgreSQL)
# - dbt for transformations
# - Metabase for dashboards
# - Adminer for database inspection
# =============================================================

services:
  # ------------------------------------------------------------
  # SOURCE 1: Issues Reporting App Database
  # ------------------------------------------------------------
  # Simulates the database of an app where IPT staff and students
  # can report maintenance issues (broken heating, leaks, etc.)

  issues_db:
    image: postgres:15-alpine
    container_name: ipt_issues_db
    environment:
      POSTGRES_DB: issues_app
      POSTGRES_USER: issues_user
      POSTGRES_PASSWORD: issues_pass
    ports:
      - "5432:5432"
    volumes:
      - ./source_databases/issues_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issues_user -d issues_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # ------------------------------------------------------------
  # SOURCE 2: Room Reservations App Database
  # ------------------------------------------------------------
  # Simulates the database of an app for booking rooms
  # (classes, meetings, exams, events)

  reservations_db:
    image: postgres:15-alpine
    container_name: ipt_reservations_db
    environment:
      POSTGRES_DB: reservations_app
      POSTGRES_USER: reservations_user
      POSTGRES_PASSWORD: reservations_pass
    ports:
      - "5433:5432"
    volumes:
      - ./source_databases/reservations_db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations_user -d reservations_app"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # ------------------------------------------------------------
  # DATA WAREHOUSE
  # ------------------------------------------------------------
  # Central analytics database where all data is combined

  warehouse:
    image: postgres:15-alpine
    container_name: ipt_warehouse
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_pass
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ipt_network

  # ------------------------------------------------------------
  # ADMINER - Database Management UI
  # ------------------------------------------------------------
  # Web interface to inspect all databases
  # Access at: http://localhost:8080

  adminer:
    image: adminer:latest
    container_name: ipt_adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: warehouse
    depends_on:
      - issues_db
      - reservations_db
      - warehouse
    networks:
      - ipt_network

  # ------------------------------------------------------------
  # DBT + PSQL TOOLS CONTAINER
  # ------------------------------------------------------------
  # Contains psql (for ingestion) and dbt (for transforms)
  # Runs scripts without needing local installations

  tools:
    build:
      context: ./tools
      dockerfile: Dockerfile
    container_name: ipt_tools
    volumes:
      - ./scripts:/scripts:ro
      - ./dbt:/dbt
    environment:
      # Source databases (using Docker network hostnames)
      ISSUES_DB: "postgresql://issues_user:issues_pass@issues_db:5432/issues_app"
      RESERVATIONS_DB: "postgresql://reservations_user:reservations_pass@reservations_db:5432/reservations_app"
      WAREHOUSE: "postgresql://dbt_user:dbt_pass@warehouse:5432/warehouse"
    depends_on:
      issues_db:
        condition: service_healthy
      reservations_db:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    networks:
      - ipt_network
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    command: sleep infinity

  # ------------------------------------------------------------
  # METABASE - Business Intelligence
  # ------------------------------------------------------------
  # Dashboard and visualization tool
  # Access at: http://localhost:3000

  metabase:
    image: metabase/metabase:latest
    container_name: ipt_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    depends_on:
      warehouse:
        condition: service_healthy
    networks:
      - ipt_network

networks:
  ipt_network:
    driver: bridge
